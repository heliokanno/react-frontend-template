# Configuração do pnpm (v11+ lê as settings daqui, não mais de package.json#pnpm).
# allowBuilds libera explicitamente os pacotes autorizados a rodar build scripts
# na instalação, de forma determinística e versionada.
#
# Monorepo (spec 013): o núcleo publicável vive em packages/*; o app de
# demonstração (playground) vive em apps/*.
packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': set this to true or false
  esbuild: true
  msw: true
